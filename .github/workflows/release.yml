name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/release.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'waterreminder-release' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'waterreminder' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'waterreminder-release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_FILE")"
          if [ -n "${SECRET_KEYSTORE:-}" ]; then
            echo "$SECRET_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
            echo "signing with the repository secret keystore"
          else
            cp android/keystore/release.p12 "$ANDROID_KEYSTORE_FILE"
            echo "signing with the committed demo keystore"
          fi
          test -s "$ANDROID_KEYSTORE_FILE"
          echo "keystore ready: $(stat -c %s "$ANDROID_KEYSTORE_FILE") bytes"

      - name: Unit tests
        working-directory: android
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -la "$APK"

          echo "--- signature ---"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

          echo "--- manifest ---"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"

          echo "--- archive contents (head) ---"
          unzip -l "$APK" | head -30

          cp "$APK" "../Water-Reminder-${GITHUB_REF_NAME}.apk"
          ls -la "../Water-Reminder-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Water Reminder ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Water-Reminder-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
