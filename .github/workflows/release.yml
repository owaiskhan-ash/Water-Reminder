name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'waterreminder-release' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'waterreminder' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'waterreminder-release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYFILE="${RUNNER_TEMP}/release.p12"
          if [ -n "${SECRET_KEYSTORE:-}" ]; then
            echo "$SECRET_KEYSTORE" | base64 --decode > "$KEYFILE"
            echo "signing with the repository secret keystore"
          else
            cp android/keystore/release.p12 "$KEYFILE"
            echo "signing with the committed demo keystore"
          fi
          test -s "$KEYFILE"
          echo "keystore ready: $(stat -c %s "$KEYFILE") bytes"
          echo "ANDROID_KEYSTORE_FILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Build signed release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/assemble.log
          exit ${PIPESTATUS[0]}

      - name: Verify APK
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -la "$APK"

          echo "--- signature ---"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

          echo "--- manifest ---"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"

          echo "--- archive contents (head) ---"
          unzip -l "$APK" | head -30

          cp "$APK" "../Water-Reminder-${GITHUB_REF_NAME}.apk"
          ls -la "../Water-Reminder-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Water Reminder ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Water-Reminder-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Release diagnostics"
            echo ""
            echo "Tag: \`${GITHUB_REF_NAME}\`"
            for f in unit-tests assemble; do
              if [ -f "/tmp/$f.log" ]; then
                echo ""
                echo "<details><summary>$f</summary>"
                echo ""
                echo '```'
                tail -250 "/tmp/$f.log"
                echo '```'
                echo ""
                echo "</details>"
              fi
            done
          } > /tmp/report.md
          gh issue create --title "Release diagnostics ${GITHUB_REF_NAME}" --body-file /tmp/report.md || true
